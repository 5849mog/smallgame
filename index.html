<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>末日之门 · Doomsday Gates</title>
  <style>
    :root {
      --blue: #3aa0ff;
      --red: #ff5a5a;
      --gold: #ffd24a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #120d1a; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      -webkit-user-select: none; user-select: none;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
    #hud.visible { display: block; }

    #topbar {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: min(520px, 78vw); display: flex; align-items: center; gap: 12px;
    }
    #levelTag {
      flex: none; padding: 6px 14px; border-radius: 999px;
      background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.18);
      font-weight: 700; font-size: 14px; letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }
    #progressTrack {
      flex: 1; height: 10px; border-radius: 999px;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.15);
      overflow: hidden;
    }
    #progressFill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #38e07b, #a5f36b);
      border-radius: 999px; transition: width .15s linear;
    }
    #progressFlag { flex: none; font-size: 16px; }

    #countBadge {
      position: absolute; transform: translate(-50%, -100%);
      padding: 3px 12px; border-radius: 999px;
      background: linear-gradient(180deg, #2e9bff, #1668d8);
      border: 2px solid rgba(255,255,255,.85);
      font-weight: 800; font-size: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.45);
      white-space: nowrap;
    }

    #muteBtn {
      position: absolute; top: 12px; right: 14px; pointer-events: auto;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-size: 18px; cursor: pointer;
    }

    #weaponTag {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      padding: 8px 22px; border-radius: 999px;
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,210,74,.5);
      font-weight: 800; font-size: 16px; letter-spacing: 1px;
      color: var(--gold); text-shadow: 0 1px 3px #000;
      white-space: nowrap;
    }
    /* 底部武器栏：6 把武器自由切换 */
    #weaponBar {
      position: absolute; bottom: 66px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; pointer-events: auto;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15);
    }
    .weaponSlot {
      cursor: pointer; border: 1px solid rgba(255,255,255,.2); outline: none;
      border-radius: 999px; padding: 6px 10px; min-width: 58px;
      background: rgba(255,255,255,.08); color: #ccc;
      font-size: 15px; font-weight: 800; letter-spacing: 0;
      transition: transform .08s ease, background .1s ease, border-color .1s ease;
      white-space: nowrap;
    }
    .weaponSlot:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); }
    .weaponSlot.active {
      background: linear-gradient(180deg, #ffe259, #ffa751);
      color: #4a2600; border-color: #ffe259;
      box-shadow: 0 0 14px rgba(255,210,74,.45);
    }
    .weaponSlot .ws-lv { font-size: 11px; opacity: .85; margin-left: 2px; }
    #buffRow {
      position: absolute; bottom: 122px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px;
    }
    .buffChip {
      padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 800;
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3);
      text-shadow: 0 1px 2px #000;
    }

    #banner {
      position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%) scale(.5);
      font-size: clamp(30px, 7vw, 54px); font-weight: 900; letter-spacing: 6px;
      color: #ffe9a8; text-shadow: 0 0 30px rgba(255,170,60,.8), 0 3px 8px #000;
      opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #banner.show { animation: bannerPop 1.8s ease-out forwards; }
    @keyframes bannerPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      25%  { transform: translate(-50%, -50%) scale(1); }
      75%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
    }

    #flash {
      position: fixed; inset: 0; background: #fff; opacity: 0;
      pointer-events: none; z-index: 5;
    }
    #flash.boom { animation: nukeFlash .7s ease-out forwards; }
    @keyframes nukeFlash {
      0% { opacity: 0; } 12% { opacity: .95; } 100% { opacity: 0; }
    }

    /* 冰冻世界的全屏提示：一眼看出是冰冻效果，而非"僵尸卡住"。
       用 visibility 而不是仅 opacity 控制：iOS Safari 上 opacity:0 的全屏层仍参与合成，可能干扰兄弟元素渲染 */
    #freezeFx {
      position: fixed; inset: 0; pointer-events: none; z-index: 4;
      background: radial-gradient(ellipse at 50% 45%, rgba(150,210,255,.30), rgba(80,140,255,.14));
      opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s;
    }
    #freezeFx.on { opacity: 1; visibility: visible; }

    /* Floating math text */
    .floatText {
      position: absolute; transform: translate(-50%, -50%);
      font-size: 30px; font-weight: 900; pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,.7);
      animation: floatUp 1.1s ease-out forwards;
    }
    .floatText.good { color: var(--blue); }
    .floatText.bad  { color: var(--red); }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, -40%) scale(.6); }
      15%  { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -180%) scale(1); }
    }

    /* ---------- overlays ---------- */
    .overlay {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      background: radial-gradient(ellipse at 50% 35%, rgba(40,25,60,.82), rgba(8,5,14,.94));
      text-align: center; z-index: 10;
      overflow-y: auto; /* 内容超高时可滚动，不会被裁 */
      align-items: safe center; justify-content: safe center; /* 异常视口（缩放/分屏）下回退顶部对齐 */
    }
    .overlay.visible { display: flex; }
    .overlay h1 {
      font-size: clamp(38px, 8vw, 64px); font-weight: 900; letter-spacing: 6px;
      background: linear-gradient(180deg, #ffe9a8, #ff9d3d);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 14px rgba(255,150,50,.35));
      margin-bottom: 10px;
    }
    .overlay h2 { font-size: clamp(26px, 6vw, 44px); font-weight: 900; letter-spacing: 4px; margin-bottom: 14px; }
    .overlay .sub { color: #cbbfe0; font-size: 15px; line-height: 1.9; margin-bottom: 30px; }
    .overlay .sub b.blue { color: var(--blue); }
    .overlay .sub b.red { color: var(--red); }
    .overlay .sub b.gold { color: var(--gold); }
    .btn {
      pointer-events: auto; cursor: pointer; border: none; outline: none;
      padding: 15px 52px; border-radius: 999px;
      font-size: 20px; font-weight: 900; letter-spacing: 3px; color: #4a2600;
      background: linear-gradient(180deg, #ffe259, #ffa751);
      box-shadow: 0 6px 0 #b96c17, 0 12px 26px rgba(0,0,0,.5);
      transition: transform .08s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b96c17, 0 6px 14px rgba(0,0,0,.5); }
    .btn.secondary {
      margin-top: 16px; padding: 10px 34px; font-size: 15px; color: #ddd;
      background: rgba(255,255,255,.1); box-shadow: none; border: 1px solid rgba(255,255,255,.25);
    }
    #resultStats { font-size: 17px; color: #efe6ff; margin-bottom: 26px; line-height: 2; }
    #resultTitle.win  { color: #7dff9b; text-shadow: 0 0 24px rgba(90,255,140,.4); }
    #resultTitle.lose { color: #ff6d6d; text-shadow: 0 0 24px rgba(255,80,80,.4); }

    .menuBtns { display: flex; gap: 14px; align-items: center; justify-content: center; }
    .menuBtns .btn.secondary { margin-top: 0; }

    /* ---------- 局外成长面板 ---------- */
    #metaCoins { font-size: 20px; font-weight: 900; color: var(--gold); margin-bottom: 16px; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(255,210,74,.3); }
    #metaList { width: min(580px, 92vw); max-height: 56vh; max-height: 56dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .metaItem {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-radius: 14px; text-align: left;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    }
    .metaItem.paid { border-color: rgba(255,210,74,.5); background: rgba(255,210,74,.07); }
    .metaItem .mi-icon { font-size: 26px; flex: none; }
    .metaItem .mi-info { flex: 1; min-width: 0; }
    .metaItem .mi-name { font-weight: 800; font-size: 15px; }
    .metaItem .mi-desc { font-size: 12.5px; color: #cbbfe0; margin-top: 2px; }
    .metaItem .mi-level { font-size: 12px; color: var(--gold); margin-top: 3px; letter-spacing: 1px; }
    .metaItem .mi-btn {
      flex: none; pointer-events: auto; cursor: pointer; border: none; outline: none;
      border-radius: 999px; padding: 8px 18px; font-size: 13px; font-weight: 800;
      color: #4a2600; background: linear-gradient(180deg, #ffe259, #ffa751);
    }
    .metaItem .mi-btn:disabled { background: rgba(255,255,255,.12); color: #999; cursor: default; }
    .metaItem .mi-btn.paid-btn { background: linear-gradient(180deg, #7ee0ff, #3aa0ff); color: #06243a; }

    /* ---------- 击杀三选一强化卡 ---------- */
    #upgradeCards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .upgCard {
      pointer-events: auto; cursor: pointer; width: 170px; padding: 22px 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      border: 2px solid rgba(255,210,74,.55);
      transition: transform .1s ease, box-shadow .1s ease;
    }
    .upgCard:hover { transform: translateY(-6px); box-shadow: 0 10px 30px rgba(255,180,60,.25); }
    .upgCard .uc-icon { font-size: 42px; margin-bottom: 10px; }
    .upgCard .uc-label { font-size: 17px; font-weight: 900; color: var(--gold); }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="topbar">
      <div id="levelTag">0m</div>
      <div id="progressTrack"><div id="progressFill"></div></div>
      <div id="progressFlag">🧟</div>
    </div>
    <div id="countBadge">5</div>
    <div id="buffRow"></div>
    <div id="weaponBar"></div>
    <div id="weaponTag">🔫 步枪</div>
    <div id="banner"></div>
    <button id="muteBtn" title="静音">🔊</button>
  </div>
  <div id="flash"></div>
  <div id="freezeFx"></div>

  <div id="menuOverlay" class="overlay visible">
    <h1>末日之门</h1>
    <div class="sub">
      无尽模式：拖动 / 方向键 左右移动小队，穿过 <b class="blue">蓝色增益门</b>，避开 <b class="red">红色削弱门</b><br />
      <b class="red">负数门</b>可以被子弹打回正数；<b class="gold">武器门</b>二选一，倒计数打到 0 立即升级该武器！<br />
      底部武器栏可 <b class="gold">自由切换武器</b>，击杀攒经验触发 <b class="gold">三选一强化</b>，每隔一段路还有 <b class="red">尸潮爆发</b> —— 看你能跑多远 🧟
    </div>
    <div class="menuBtns">
      <button id="startBtn" class="btn">开始行动</button>
      <button id="metaBtn" class="btn secondary">🔧 强化基地</button>
    </div>
  </div>

  <div id="resultOverlay" class="overlay">
    <h2 id="resultTitle">胜利！</h2>
    <div id="resultStats"></div>
    <button id="resultBtn" class="btn">下一关</button>
    <button id="resetBtn" class="btn secondary">回到第 1 关</button>
  </div>

  <div id="metaOverlay" class="overlay">
    <h2>🔧 强化基地</h2>
    <div id="metaCoins">💰 0</div>
    <div id="metaList"></div>
    <button id="metaCloseBtn" class="btn secondary">返回</button>
  </div>

  <div id="upgradeOverlay" class="overlay">
    <h2>🆙 升级！</h2>
    <div class="sub">击杀越多，变得越强 —— 三选一</div>
    <div id="upgradeCards"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
